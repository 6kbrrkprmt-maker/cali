<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cali LiveKit POC</title>
  <link rel="stylesheet" href="/poc-livekit.css">
</head>
<body>
  <main class="shell">
    <section class="panel auth-panel" id="authPanel">
      <div>
        <p class="eyebrow">LiveKit 60fps POC</p>
        <h1>瀏覽器低延遲串流測試</h1>
      </div>
      <form id="loginForm" class="login-form">
        <label>
          帳號
          <input id="account" autocomplete="username" required>
        </label>
        <label>
          密碼
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">登入並建立測試房間</button>
      </form>
      <p id="loginStatus" class="status">等待登入</p>
    </section>

    <section class="stage" id="stage" hidden>
      <div class="topbar">
        <div>
          <p class="eyebrow">Room</p>
          <strong id="roomName">-</strong>
        </div>
        <div class="status" id="streamStatus">等待串流</div>
      </div>
      <div class="video-wrap" id="videoWrap">
        <video id="remoteVideo" autoplay playsinline muted></video>
        <div class="placeholder" id="placeholder">
          <strong>已連上 LiveKit</strong>
          <span>等待 Worker 發布 60fps 畫面</span>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/poc-livekit.js"></script>
</body>
</html>
