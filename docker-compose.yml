services:
  postgres:
    image: postgres:16
    container_name: calibet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cali
      POSTGRES_PASSWORD: cali_password
      POSTGRES_DB: calibet_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: calibet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
