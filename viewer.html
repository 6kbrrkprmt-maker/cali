<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaliBet Bridge Viewer</title>
  <link rel="stylesheet" href="/viewer.css" />
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <h1 class="title">Bridge Viewer</h1>
      <p class="sub">先登入平台，再啟動遠端會話，右側即時顯示遠端畫面。</p>

      <div class="group">
        <label>API Base URL</label>
        <input id="apiBase" value="http://localhost:4000" />
      </div>

      <div class="group">
        <label>Platform Account</label>
        <input id="account" placeholder="例如 admin01" />
      </div>

      <div class="group">
        <label>Password</label>
        <input id="password" type="password" placeholder="你的平台密碼" />
      </div>

      <div class="actions">
        <button id="btnLogin" class="primary">1) 平台登入</button>
        <button id="btnStart" class="secondary">2) 啟動 Bridge 並看畫面</button>
        <button id="btnRecords" class="ghost">本站紀錄</button>
      </div>

      <pre id="status" class="status">尚未操作</pre>
    </aside>

    <main class="stage">
      <div class="screen-wrap">
        <video id="screen" autoplay muted playsinline aria-label="Remote Screen"></video>
        <button id="recordsOverlay" class="records-overlay" title="開啟本站紀錄">本站紀錄</button>
      </div>
    </main>
  </div>

  <script type="module" src="/viewer.js"></script>
</body>
</html>
