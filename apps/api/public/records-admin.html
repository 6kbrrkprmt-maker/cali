<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本站紀錄後台</title>
  <link rel="stylesheet" href="/records-admin.css" />
</head>
<body>
  <main class="admin-shell">
    <header class="topbar">
      <h1>本站紀錄後台</h1>
      <div class="login-row">
        <input id="apiBase" value="http://localhost:4000" />
        <input id="account" value="admin02" />
        <input id="password" type="password" value="Aa12345678" />
        <button id="loginBtn">登入</button>
        <span id="status">未登入</span>
      </div>
    </header>

    <section class="workspace">
      <aside class="list-panel">
        <div class="tabs">
          <button class="tab active" data-kind="BET" data-endpoint="bet">投注</button>
          <button class="tab" data-kind="CREDIT" data-endpoint="credit">額度</button>
          <button class="tab" data-kind="EGAME" data-endpoint="egame">電子</button>
        </div>
        <div id="recordList" class="record-list"></div>
      </aside>

      <section class="editor-panel">
        <div class="selected">
          <span>目前紀錄</span>
          <strong id="selectedLabel">尚未選擇</strong>
        </div>
        <label>修正原因<input id="reason" value="後台校正顯示紀錄" /></label>
        <label>異動備註<input id="changeNote" value="manual adjustment" /></label>
        <label>覆蓋欄位 JSON<textarea id="nextValue" spellcheck="false">{
  "winLoss": "0.00",
  "status": "後台修正"
}</textarea></label>
        <button id="saveBtn" class="save">新增修正版</button>
        <pre id="result">等待操作</pre>
      </section>
    </section>
  </main>

  <script src="/records-admin.js"></script>
</body>
</html>
