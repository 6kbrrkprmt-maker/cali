<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaliBet</title>
  <link rel="stylesheet" href="/play.css" />
</head>
<body>
  <main class="app-shell" data-state="hall">
    <section id="hallPanel" class="hall-panel" aria-label="遊戲廳">
      <aside class="hall-sidebar" aria-label="遊戲分類">
        <div class="hall-logo"><span>C</span><small>卡利系統</small></div>
        <button class="side-game active" type="button"><span>熱</span>熱門遊戲</button>
        <button class="side-game" type="button"><span>全</span>所有遊戲</button>
        <button class="side-game" type="button"><span>百</span>所有百家樂</button>
        <button class="side-game" type="button"><span>性</span>性感廳</button>
        <button class="side-game" type="button"><span>超</span>超級多台</button>
        <button class="side-game" type="button"><span>骰</span>骰寶</button>
        <button class="side-game" type="button"><span>包</span>包桌</button>
        <button class="side-game" type="button"><span>推</span>推薦子</button>
        <button class="side-game" type="button"><span>AB</span>AB輪盤</button>
      </aside>

      <section class="hall-main">
        <header class="hall-topbar">
          <div class="player-pill"><span class="avatar-dot"></span>ID:<strong id="hallAccount">--</strong></div>
          <div class="credit-pill"><span>餘額</span><strong id="hallBalance">--</strong></div>
          <div class="range-pill"><span>限紅</span><strong id="hallRange">5 - 3,000</strong></div>
          <button id="hallRecordsBtn" class="hall-icon-btn" type="button">紀錄</button>
          <button id="hallFullscreenBtn" class="hall-icon-btn" type="button">全螢幕</button>
        </header>

        <nav class="recent-strip" aria-label="最近遊戲">
          <div class="recent-title">最近遊戲</div>
          <button class="recent-game active" type="button"><span>B601</span><small>百家樂</small></button>
          <button class="recent-game" type="button"><span>B201</span><small>保險百家樂</small></button>
          <button class="recent-game" type="button"><span>B18</span><small>經典百家樂</small></button>
          <button class="recent-game" type="button"><span>B201</span><small>牛牛</small></button>
          <button class="recent-game image" type="button"><span>海盜女王</span></button>
          <button class="recent-game" type="button"><span>招財獅子</span><small>熱門</small></button>
          <button class="recent-game loading" type="button"><span></span><small>牛牛</small></button>
          <button class="recent-game" type="button"><span>C202</span><small>快速百家樂</small></button>
        </nav>

        <section class="table-grid" aria-label="百家樂桌台">
          <article class="hall-table large" data-open-table="B601" tabindex="0">
            <div class="table-title"><span>牛牛 BB201</span><strong class="count red">0</strong></div>
            <div class="dealer-card dealer-irna"><span>Irma</span></div>
            <div class="road-board road-wide" data-road="mixed"></div>
          </article>
          <article class="hall-table" data-open-table="D201" tabindex="0">
            <div class="table-title"><span>龍虎 D201</span><strong class="count red">0</strong></div>
            <div class="dealer-card dealer-aiah"><span>Aiah</span></div>
            <div class="road-board dimmed"><em>洗牌中</em></div>
          </article>
          <article class="hall-table" data-open-table="P201" tabindex="0">
            <div class="table-title"><span>經典博丁 P201</span><strong class="count green">17</strong></div>
            <div class="dealer-card dealer-emmy"><span>Emmy</span></div>
            <div class="road-board bead-road" data-road="bead"></div>
          </article>
          <article class="hall-table" data-open-table="P202" tabindex="0">
            <div class="table-title"><span>莊閒博丁 P201</span><strong class="count green">17</strong></div>
            <div class="dealer-card dealer-emmy"><span>Emmy</span></div>
            <div class="road-board bead-road" data-road="bead-alt"></div>
          </article>
          <article class="hall-table large" data-open-table="B501" tabindex="0">
            <div class="table-title"><span>保險百家樂 IB201</span><strong class="count red">0</strong></div>
            <div class="dealer-card dealer-mayra"><span>Mayra</span></div>
            <div class="road-board empty-road"></div>
          </article>
        </section>
      </section>
    </section>

    <section id="gamePanel" class="game-panel" aria-label="百家樂桌內畫面">
      <header class="game-topbar">
        <div class="brand">CaliBet</div>
        <div class="session-state" id="sessionState">連線中</div>
        <button id="recordsBtn" class="top-action">投注記錄</button>
        <button id="fullscreenBtn" class="top-action">全螢幕</button>
        <button id="backHallBtn" class="top-action subtle">返回遊戲廳</button>
        <button id="logoutBtn" class="top-action subtle">重連</button>
      </header>

      <div class="screen-frame">
        <video id="screen" autoplay muted playsinline aria-label="CaliBet"></video>
        <img id="frameScreen" alt="CaliBet" hidden />
        <div id="loadingLayer" class="loading-layer">
          <div class="spinner"></div>
          <strong id="loadingTitle">正在連線</strong>
          <span id="loadingText">請稍候</span>
        </div>
        <button id="recordsHotspot" class="records-hotspot" title="投注記錄">投注記錄</button>
        <section id="baccaratPanel" class="baccarat-panel" aria-label="百家樂下注">
          <div class="baccarat-status">
            <span>餘額 <strong id="baccaratBalance">--</strong></span>
            <span>局號 <strong id="baccaratRound">--</strong></span>
            <span id="baccaratMessage">選擇籌碼後下注</span>
          </div>
          <div class="baccarat-bets">
            <button class="bet-zone player" data-bet-side="player" type="button"><span>閒</span><strong id="playerTotal">0</strong></button>
            <button class="bet-zone tie" data-bet-side="tie" type="button"><span>和</span><strong id="tieTotal">0</strong></button>
            <button class="bet-zone banker" data-bet-side="banker" type="button"><span>莊</span><strong id="bankerTotal">0</strong></button>
          </div>
          <div class="chip-row" id="chipRow">
            <button class="chip active" data-chip="100" type="button">100</button>
            <button class="chip" data-chip="500" type="button">500</button>
            <button class="chip" data-chip="1000" type="button">1K</button>
            <button class="chip" data-chip="5000" type="button">5K</button>
            <button class="chip" data-chip="10000" type="button">10K</button>
            <button id="resetBaccaratBtn" class="panel-action" type="button">重置</button>
          </div>
          <div class="settle-row" aria-label="測試結算">
            <button data-settle="player" type="button">閒贏</button>
            <button data-settle="banker" type="button">莊贏</button>
            <button data-settle="tie" type="button">和局</button>
          </div>
        </section>
      </div>

      <section id="recordsModal" class="records-modal" aria-label="投注記錄" hidden>
        <div class="records-window">
          <div class="records-titlebar">
            <strong>投注記錄</strong>
            <button id="closeRecordsBtn" class="modal-close" type="button">關閉</button>
          </div>
          <iframe id="recordsFrame" title="投注記錄"></iframe>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="/play.js?v=hall-20260822"></script>
</body>
</html>
