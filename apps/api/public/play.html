<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaliBet</title>
  <link rel="stylesheet" href="/play.css" />
</head>
<body>
  <main class="app-shell" data-state="hall">
    <section id="hallPanel" class="hall-panel" aria-label="遊戲廳">
      <iframe id="caliHallFrame" class="cali-hall-frame" src="/cali-reference/hall.html" title="CaliBet 遊戲廳"></iframe>
      <div class="hall-system-layer" aria-label="本站遊戲廳操作層">
        <button class="hall-hotspot hall-hotspot-records" id="hallRecordsBtn" type="button" aria-label="投注紀錄"></button>
        <button class="hall-hotspot hall-hotspot-fullscreen" id="hallFullscreenBtn" type="button" aria-label="全螢幕"></button>
        <button class="hall-hotspot table-hotspot table-hotspot-1" data-open-table="B601" type="button" aria-label="進入 B601"></button>
        <button class="hall-hotspot table-hotspot table-hotspot-2" data-open-table="D201" type="button" aria-label="進入 D201"></button>
        <button class="hall-hotspot table-hotspot table-hotspot-3" data-open-table="P201" type="button" aria-label="進入 P201"></button>
        <button class="hall-hotspot table-hotspot table-hotspot-4" data-open-table="P202" type="button" aria-label="進入 P202"></button>
        <button class="hall-hotspot table-hotspot table-hotspot-5" data-open-table="B501" type="button" aria-label="進入 B501"></button>
      </div>
    </section>

    <section id="gamePanel" class="game-panel" aria-label="百家樂桌內畫面">
      <header class="game-topbar" hidden>
        <div class="brand">CaliBet</div>
        <div class="session-state" id="sessionState">連線中</div>
        <button id="recordsBtn" class="top-action">投注記錄</button>
        <button id="fullscreenBtn" class="top-action">全螢幕</button>
        <button id="backHallBtn" class="top-action subtle">返回遊戲廳</button>
        <button id="logoutBtn" class="top-action subtle">重連</button>
      </header>

      <div class="screen-frame">
        <iframe id="caliTableFrame" class="cali-table-frame" src="/cali-reference/baccarat-table.html" title="CaliBet 百家樂桌"></iframe>
        <div class="table-system-layer" aria-label="本站百家樂操作層">
          <button class="table-action-hotspot table-back-hotspot" id="tableBackHotspot" type="button" aria-label="返回遊戲廳"></button>
          <button class="table-action-hotspot table-records-hotspot" id="tableRecordsHotspot" type="button" aria-label="投注紀錄"></button>
          <button class="table-action-hotspot table-fullscreen-hotspot" id="tableFullscreenHotspot" type="button" aria-label="全螢幕"></button>
          <button class="table-action-hotspot table-bet-hotspot table-bet-player" data-bet-side="player" type="button" aria-label="下注閒"></button>
          <button class="table-action-hotspot table-bet-hotspot table-bet-tie" data-bet-side="tie" type="button" aria-label="下注和"></button>
          <button class="table-action-hotspot table-bet-hotspot table-bet-banker" data-bet-side="banker" type="button" aria-label="下注莊"></button>
          <button class="table-action-hotspot table-chip-hotspot table-chip-100" data-chip="100" type="button" aria-label="籌碼 100"></button>
          <button class="table-action-hotspot table-chip-hotspot table-chip-500" data-chip="500" type="button" aria-label="籌碼 500"></button>
          <button class="table-action-hotspot table-chip-hotspot table-chip-1000" data-chip="1000" type="button" aria-label="籌碼 1000"></button>
          <button class="table-action-hotspot table-chip-hotspot table-chip-3000" data-chip="3000" type="button" aria-label="籌碼 3000"></button>
          <button class="table-action-hotspot table-chip-hotspot table-chip-10000" data-chip="10000" type="button" aria-label="籌碼 10000"></button>
          <div id="tableActionStatus" class="table-action-status" aria-live="polite"></div>
        </div>
        <video id="screen" autoplay muted playsinline aria-label="CaliBet"></video>
        <img id="frameScreen" alt="CaliBet" hidden />
        <div id="loadingLayer" class="loading-layer">
          <div class="spinner"></div>
          <strong id="loadingTitle">正在連線</strong>
          <span id="loadingText">請稍候</span>
        </div>
        <button id="recordsHotspot" class="records-hotspot" title="投注記錄">投注記錄</button>
        <section id="baccaratPanel" class="baccarat-panel" aria-label="百家樂下注">
          <div class="baccarat-status">
            <span>餘額 <strong id="baccaratBalance">--</strong></span>
            <span>局號 <strong id="baccaratRound">--</strong></span>
            <span id="baccaratMessage">選擇籌碼後下注</span>
          </div>
          <div class="baccarat-bets">
            <button class="bet-zone player" data-bet-side="player" type="button"><span>閒</span><strong id="playerTotal">0</strong></button>
            <button class="bet-zone tie" data-bet-side="tie" type="button"><span>和</span><strong id="tieTotal">0</strong></button>
            <button class="bet-zone banker" data-bet-side="banker" type="button"><span>莊</span><strong id="bankerTotal">0</strong></button>
          </div>
          <div class="chip-row" id="chipRow">
            <button class="chip active" data-chip="100" type="button">100</button>
            <button class="chip" data-chip="500" type="button">500</button>
            <button class="chip" data-chip="1000" type="button">1K</button>
            <button class="chip" data-chip="5000" type="button">5K</button>
            <button class="chip" data-chip="10000" type="button">10K</button>
            <button id="resetBaccaratBtn" class="panel-action" type="button">重置</button>
          </div>
          <div class="settle-row" aria-label="測試結算">
            <button data-settle="player" type="button">閒贏</button>
            <button data-settle="banker" type="button">莊贏</button>
            <button data-settle="tie" type="button">和局</button>
          </div>
        </section>
      </div>

      <section id="recordsModal" class="records-modal" aria-label="投注記錄" hidden>
        <div class="records-window">
          <div class="records-titlebar">
            <strong>投注記錄</strong>
            <button id="closeRecordsBtn" class="modal-close" type="button">關閉</button>
          </div>
          <iframe id="recordsFrame" title="投注記錄"></iframe>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="/play.js?v=table-hotspots-20260823"></script>
</body>
</html>
